serenity {
  project.name = "HomeOffice Assessment"
  browser {
    maximized = true
    use.unique.browser = false
  }
  restart.browser.each.scenario = true
  dry.run = false
  take.screenshots = AFTER_EACH_STEP
  # Set parallel.methods=true to enable parallel scenario execution.
  parallel.methods = false
  thread.count = 4
  test.root = "homeoffice"
  webdriver {
    driver = ${?webdriver.driver} // Defaults to local driver if not explicitly set
    autodownload = true
    timeouts {
      implicitlywait = 20000
    }
    wait {
      for {
        timeouts = 10000
      }
    }
    chrome {
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = [
            "--start-maximized", "--homepage=about:blank", "--no-first-run",
            "test-type", "no-sandbox", "lang=es", "disable-popup-blocking",
            "disable-download-notification", "ignore-certificate-errors",
            "allow-running-insecure-content", "disable-translate",
            "always-authorize-plugins", "disable-extensions"
          ]
        }
      }
    }
  }
  environments {
    default {
      webdriver.driver = chrome
      webdriver.base.url = "https://www.saucedemo.com/"
      postcode.url = "https://api.postcodes.io/"
      postcode.api.endpoint = "https://api.postcodes.io/postcodes/"
    }
    remote {
      webdriver.driver = remote
      webdriver.remote.url = "http://selenium-hub:4444/wd/hub"
      webdriver.chrome.capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = [
            "headless", "disable-gpu", "no-sandbox", "disable-dev-shm-usage",
            "window-size=1920,1080", "disable-popup-blocking", "ignore-certificate-errors"
          ]
        }
      }
    }
  }
  headless.mode = true
  postcodes {
    api {
      base-url = "https://api.postcodes.io"
      lookup-endpoint = "/postcodes/{postcode}"
      nearest-endpoint = "/postcodes"
      outcode-nearest-endpoint = "/outcodes/{outcode}/nearest"
      postcode-path-parameter = "postcode"
      outcode-path-parameter = "outcode"
      longitude-query-parameter = "lon"
      latitude-query-parameter = "lat"
      timeout-milliseconds = 10000
      log-http = true
      success-status-code = 200
      not-found-status-code = 404
      json-paths {
        lookup-postcode = "result.postcode"
        lookup-longitude = "result.longitude"
        lookup-latitude = "result.latitude"
        nearest-first-postcode = "result[0].postcode"
        nearest-postcodes = "result.postcode"
        nearest-distances = "result.distance"
        result = "result"
      }
    }
    stub {
      mappings-file = "stubs/postcodes-stub-mappings.csv"
      responses-directory = "stubs/responses"
    }
  }
}
