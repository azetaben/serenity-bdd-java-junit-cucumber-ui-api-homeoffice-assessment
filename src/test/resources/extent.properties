extent.reporter.spark.start=true
extent.reporter.html.start=true
extent.reporter.spark.config=src/test/resources/spark-config.xml
extent.reporter.html.config=src/test/resources/html-config.xml
extent.reporter.spark.out=Spark/PostcodesApiSparkReport.html
extent.reporter.html.out=Html/PostcodesApiExtentReport.html

# test,exception,category,device,author,log,dashboard - default order
extent.reporter.spark.vieworder=dashboard,test,exception,category,device,author

# Embed images as base64 strings. Default is false.
extent.reporter.spark.base64imagesrc=true

# Enable device and author tag parsing. Default is false.
extent.reporter.spark.enable.device=true
extent.reporter.spark.enable.author=true

# Prefixes are case-insensitive and only used when device/author parsing is enabled.
extent.reporter.spark.prefix.device=@device_
extent.reporter.spark.prefix.author=@author_

screenshot.dir=extent-reports/screenshots/
screenshot.rel.path=../screenshots/

systeminfo.os=${os.name}
systeminfo.version=${os.version}

basefolder.name=report/extent-reports
basefolder.datetimepattern=d-MMM-YY HH-mm-ss
